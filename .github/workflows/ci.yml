name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.11"

      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Install development dependencies
        run: |
          if [ -f requirements-dev.txt ]; then
            python -m pip install -r requirements-dev.txt
          fi

      - name: Run pip-audit
        run: python -m pip_audit -r requirements.txt -f json -o pip-audit-report.json

      - name: Upload pip-audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: pip-audit-report.json
          if-no-files-found: error

      # Temporal: allow Ruff to fail while we burn down historical lint debt.
      - name: Run Ruff
        continue-on-error: true
        run: ruff check .

      - name: Run Bandit
        run: bandit -r web -c bandit.yaml --severity-level high --confidence-level high -f json -o bandit-report.json

      - name: Run tests
        run: python -m pytest --cov=web --cov-report=term-missing --cov-report=html --cov-report=xml --cov-fail-under=8.5

      - name: Upload coverage HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: htmlcov
          if-no-files-found: error

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json
          if-no-files-found: error
