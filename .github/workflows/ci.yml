name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22.x"
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Run npm audit
        run: npm run security:npm-audit

      - name: Run ESLint
        run: npm run lint:js

      - name: Run JavaScript tests
        run: npm run test:js

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.11"

      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Install development dependencies
        run: |
          if [ -f requirements-dev.txt ]; then
            python -m pip install -r requirements-dev.txt
          fi

      - name: Run pre-commit
        run: python -m pre_commit run --all-files --show-diff-on-failure

      - name: Run Semgrep
        continue-on-error: true
        run: |
          mkdir -p .semgrep
          SSL_CERT_FILE="$(python -c 'import certifi; print(certifi.where())')" \
          REQUESTS_CA_BUNDLE="$(python -c 'import certifi; print(certifi.where())')" \
          SEMGREP_LOG_FILE=.semgrep/semgrep.log \
          SEMGREP_SETTINGS_FILE=.semgrep/settings.yml \
          SEMGREP_VERSION_CACHE_PATH=.semgrep/version-cache \
          python -c "from semgrep.main import main; raise SystemExit(main())" scan --config .semgrep.yml --error --metrics=off -j 1 --json --output semgrep-report.json .

      - name: Upload Semgrep report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep-report.json
          if-no-files-found: ignore

      - name: Run pip-audit
        run: python -m pip_audit -r requirements.txt -f json -o pip-audit-report.json

      - name: Upload pip-audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: pip-audit-report.json
          if-no-files-found: error

      - name: Run Bandit
        run: bandit -r web -c bandit.yaml --severity-level high --confidence-level high -f json -o bandit-report.json

      - name: Run tests
        run: python -m pytest --cov=web --cov-report=term-missing --cov-report=html --cov-report=xml --cov-fail-under=8.5

      - name: Upload coverage HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: htmlcov
          if-no-files-found: error

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json
          if-no-files-found: error

  tooling:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22.x"
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.11"

      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Install development dependencies
        run: |
          if [ -f requirements-dev.txt ]; then
            python -m pip install -r requirements-dev.txt
          fi

      - name: Run tooling smoke tests
        run: npm run test:tooling

      - name: Start app for Locust
        run: |
          python -m web.server \
            --host 127.0.0.1 \
            --port 8000 \
            --db "$RUNNER_TEMP/tooling.sqlite" \
            --ocr-db "$RUNNER_TEMP/tooling-ocr.sqlite" \
            > "$RUNNER_TEMP/tooling-server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/tooling-server.pid"

      - name: Wait for app
        run: |
          python - <<'PY'
          import sys
          import time
          import urllib.request

          deadline = time.time() + 120
          url = "http://127.0.0.1:8000/api/health"
          last_error = None
          while time.time() < deadline:
              try:
                  with urllib.request.urlopen(url, timeout=5) as response:
                      if response.status == 200:
                          print("tooling app ready")
                          sys.exit(0)
              except Exception as exc:
                  last_error = exc
              time.sleep(1)
          raise SystemExit(f"tooling app not ready: {last_error}")
          PY

      - name: Run Locust smoke test
        env:
          LOCUST_HOST: http://127.0.0.1:8000
        run: npm run loadtest:locust

      - name: Stop app
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/tooling-server.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/tooling-server.pid")" || true
          fi
