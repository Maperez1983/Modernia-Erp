[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [
    ".venv",
    "__pycache__",
    ".pytest_cache",
    "**/generated/**",
    "**/*.generated.py",
    "**/*_generated.py",
    "**/*_pb2.py",
]

[tool.coverage.run]
source = ["web"]
branch = true
relative_files = true
omit = [
    ".venv/*",
    "tests/*",
    "**/__pycache__/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 2
# Suelo de cobertura del servidor. Medido el 2026-08-24 sobre main: 45,05 % con la
# suite entera (3.042 pruebas). Se fija medio punto por debajo para dejar margen a las
# pruebas que se saltan cuando falta node o jsdom, que si no daría rojo por el entorno
# y no por el código.
#
# No es una nota: es un suelo. Si baja, es que ha entrado código que nadie ejecuta.
# Subirlo cuando se gane terreno es parte del trabajo; bajarlo, una decisión que hay
# que justificar.
#
#   scripts/mide_la_cobertura.py
#
fail_under = 44.5
exclude_lines = [
    "pragma: no cover",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"

[tool.pytest.ini_options]
timeout = 300

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
pretty = true
exclude = '''(?x)(
    ^\.venv/|
    ^htmlcov/|
    ^tests/e2e/|
    (^|.*/)(__pycache__|generated)(/|$)|
    .*\.generated\.py$|
    .*_generated\.py$|
    .*_pb2\.py$|
    ^web/server\.py$
)'''

[[tool.mypy.overrides]]
module = ["server", "web.server"]
follow_imports = "skip"

[[tool.mypy.overrides]]
module = [
    "cairosvg",
    "pdf_utils",
    "server",
    "reportlab",
    "reportlab.*",
]
ignore_missing_imports = true
