exclude: '(^|/)(\.venv|__pycache__|\.pytest_cache|\.mypy_cache|generated)(/|$)|(^|/).*(\.generated\.py|_generated\.py|_pb2\.py)$'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args:
          - --maxkb=5000
      - id: detect-private-key
      - id: mixed-line-ending
        args:
          - --fix=no

  - repo: local
    hooks:
      - id: eslint
        name: eslint (staged browser JS)
        entry: npx --no-install eslint
        language: system
        files: ^web/(app|app-auth|app-routing|app_shared|ui-foundation|sw)\.js$

      - id: ruff
        name: ruff check (staged Python files)
        entry: python -m ruff check --force-exclude
        language: system
        types:
          - python

      - id: mypy
        name: mypy (typed web modules)
        entry: python -m mypy -p web.auth_security -p web.public_links -p web.security_utils -p web.ocr_service -p web.pdf_utils -p web.document_pdf -p web.hipotecas_pdf -p web.db_backend -p web.schema_support -p web.seguros_state
        language: system
        pass_filenames: false
        always_run: true
