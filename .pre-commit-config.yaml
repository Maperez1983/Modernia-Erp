exclude: '(^|/)(\.venv|__pycache__|\.pytest_cache|generated)(/|$)|(^|/).*(\.generated\.py|_generated\.py|_pb2\.py)$'

repos:
  - repo: local
    hooks:
      - id: ruff-modified
        name: ruff (modified Python files only)
        entry: python
        language: system
        pass_filenames: false
        always_run: true
        args:
          - -c
          - |
              import pathlib
              import subprocess
              import sys

              EXCLUDED_DIRS = {".venv", "__pycache__", ".pytest_cache"}
              EXCLUDED_SUFFIXES = (
                  ".generated.py",
                  "_generated.py",
                  "_pb2.py",
              )

              def collect_modified_paths():
                  paths = set()
                  commands = (
                      ["git", "diff", "--name-only", "--cached", "--diff-filter=ACMR"],
                      ["git", "diff", "--name-only", "--diff-filter=ACMR"],
                      ["git", "ls-files", "--others", "--exclude-standard"],
                  )
                  for cmd in commands:
                      proc = subprocess.run(cmd, check=False, capture_output=True, text=True)
                      for line in proc.stdout.splitlines():
                          path = line.strip()
                          if path:
                              paths.add(path)
                  return sorted(paths)

              def is_excluded(path):
                  parts = pathlib.PurePosixPath(path).parts
                  if any(part in EXCLUDED_DIRS for part in parts):
                      return True
                  if any(part == "generated" for part in parts):
                      return True
                  return path.endswith(EXCLUDED_SUFFIXES)

              files = [
                  path
                  for path in collect_modified_paths()
                  if path.endswith(".py") and not is_excluded(path)
              ]

              if not files:
                  sys.exit(0)

              sys.exit(subprocess.call(["ruff", "check", *files]))

      - id: trailing-whitespace-modified
        name: trailing whitespace (modified text files only)
        entry: python
        language: system
        pass_filenames: false
        always_run: true
        args:
          - -c
          - |
              import pathlib
              import subprocess
              import sys

              EXCLUDED_DIRS = {".venv", "__pycache__", ".pytest_cache"}
              EXCLUDED_SUFFIXES = (
                  ".generated.py",
                  "_generated.py",
                  "_pb2.py",
              )

              def collect_modified_paths():
                  paths = set()
                  commands = (
                      ["git", "diff", "--name-only", "--cached", "--diff-filter=ACMR"],
                      ["git", "diff", "--name-only", "--diff-filter=ACMR"],
                      ["git", "ls-files", "--others", "--exclude-standard"],
                  )
                  for cmd in commands:
                      proc = subprocess.run(cmd, check=False, capture_output=True, text=True)
                      for line in proc.stdout.splitlines():
                          path = line.strip()
                          if path:
                              paths.add(path)
                  return sorted(paths)

              def is_excluded(path):
                  parts = pathlib.PurePosixPath(path).parts
                  if any(part in EXCLUDED_DIRS for part in parts):
                      return True
                  if any(part == "generated" for part in parts):
                      return True
                  return path.endswith(EXCLUDED_SUFFIXES)

              def is_text(path):
                  try:
                      return b"\0" not in pathlib.Path(path).read_bytes()
                  except OSError:
                      return False

              changed = False
              for path in collect_modified_paths():
                  if is_excluded(path) or not is_text(path):
                      continue
                  p = pathlib.Path(path)
                  try:
                      original = p.read_text(encoding="utf-8")
                  except UnicodeDecodeError:
                      continue
                  updated = "".join(line.rstrip(" \t") for line in original.splitlines(keepends=True))
                  if updated != original:
                      p.write_text(updated, encoding="utf-8")
                      changed = True

              if changed:
                  sys.exit(1)
              sys.exit(0)

      - id: end-of-file-modified
        name: end of file (modified text files only)
        entry: python
        language: system
        pass_filenames: false
        always_run: true
        args:
          - -c
          - |
              import pathlib
              import subprocess
              import sys

              EXCLUDED_DIRS = {".venv", "__pycache__", ".pytest_cache"}
              EXCLUDED_SUFFIXES = (
                  ".generated.py",
                  "_generated.py",
                  "_pb2.py",
              )

              def collect_modified_paths():
                  paths = set()
                  commands = (
                      ["git", "diff", "--name-only", "--cached", "--diff-filter=ACMR"],
                      ["git", "diff", "--name-only", "--diff-filter=ACMR"],
                      ["git", "ls-files", "--others", "--exclude-standard"],
                  )
                  for cmd in commands:
                      proc = subprocess.run(cmd, check=False, capture_output=True, text=True)
                      for line in proc.stdout.splitlines():
                          path = line.strip()
                          if path:
                              paths.add(path)
                  return sorted(paths)

              def is_excluded(path):
                  parts = pathlib.PurePosixPath(path).parts
                  if any(part in EXCLUDED_DIRS for part in parts):
                      return True
                  if any(part == "generated" for part in parts):
                      return True
                  return path.endswith(EXCLUDED_SUFFIXES)

              def is_text(path):
                  try:
                      return b"\0" not in pathlib.Path(path).read_bytes()
                  except OSError:
                      return False

              changed = False
              for path in collect_modified_paths():
                  if is_excluded(path) or not is_text(path):
                      continue
                  p = pathlib.Path(path)
                  try:
                      data = p.read_bytes()
                  except OSError:
                      continue
                  if data and not data.endswith(b"\n"):
                      p.write_bytes(data + b"\n")
                      changed = True

              if changed:
                  sys.exit(1)
              sys.exit(0)
